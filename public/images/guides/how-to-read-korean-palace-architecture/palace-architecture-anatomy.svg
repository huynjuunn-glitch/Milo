<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1350" role="img" aria-labelledby="title desc">
  <title id="title">Observation anatomy for reading Korean palace architecture</title>
  <desc id="desc">A composite palace hall diagram labels the court, raised platform, stairs, columns, brackets and roof, while a side sequence explains how to combine approach, function, hierarchy, terrain and restoration evidence.</desc>
  <defs>
    <style>.bg{fill:#fbfaf6}.ink{fill:#17211d}.muted{fill:#56645e}.pine{fill:#173f35}.rust{fill:#a94330}.paper{fill:#fff}.soft{fill:#dde9e2}.clay{fill:#f2e7d7}.line{fill:none;stroke:#245849;stroke-width:5;stroke-linecap:round}.guide{fill:none;stroke:#a94330;stroke-width:4;stroke-dasharray:10 10}.border{stroke:#d5dcd6;stroke-width:3}.t{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.serif{font-family:Georgia,"Times New Roman",serif}.title{font-size:63px;font-weight:600}.sub{font-size:27px}.label{font-size:22px;font-weight:850;letter-spacing:2px}.h{font-size:30px;font-weight:780}.body{font-size:23px}.small{font-size:19px}</style>
  </defs>
  <rect class="bg" width="1800" height="1350"/>
  <text class="t label rust" x="100" y="82">ARCHITECTURE FIELD METHOD</text>
  <text class="serif title ink" x="100" y="158">Read from route to roof—and back to evidence</text>
  <text class="t sub muted" x="100" y="210">No single ornament identifies a building. Combine several clues, then verify the period.</text>

  <rect x="100" y="270" width="1050" height="900" rx="22" fill="#fff" stroke="#d5dcd6" stroke-width="3"/>
  <g aria-label="Composite palace hall observation diagram">
    <path d="M250 785H1020L920 690H350Z" fill="#f2e7d7" stroke="#a94330" stroke-width="4"/>
    <path d="M320 690H950L900 620H370Z" fill="#dde9e2" stroke="#245849" stroke-width="4"/>
    <rect x="400" y="425" width="470" height="195" fill="#fff" stroke="#173f35" stroke-width="5"/>
    <g fill="#a94330"><rect x="420" y="445" width="27" height="175"/><rect x="525" y="445" width="27" height="175"/><rect x="630" y="445" width="27" height="175"/><rect x="735" y="445" width="27" height="175"/><rect x="840" y="445" width="27" height="175"/></g>
    <g fill="#173f35"><rect x="406" y="420" width="55" height="24"/><rect x="511" y="420" width="55" height="24"/><rect x="616" y="420" width="55" height="24"/><rect x="721" y="420" width="55" height="24"/><rect x="826" y="420" width="55" height="24"/></g>
    <path d="M335 430Q635 245 935 430L885 470Q635 370 385 470Z" fill="#173f35"/>
    <path d="M430 690H840L790 620H480Z" fill="#f7f5ef" stroke="#a94330" stroke-width="4"/>
    <path d="M565 690 590 620M705 690 680 620" class="guide"/>
    <path d="M150 1005H1100" stroke="#d5dcd6" stroke-width="4"/>
    <path d="M280 1005V855M510 1005V855M740 1005V855M970 1005V855" stroke="#d5dcd6" stroke-width="3"/>
  </g>
  <g class="t">
    <path class="line" d="M790 325H820"/><text class="h ink" x="840" y="310">Roof form</text><text class="body muted" x="840" y="342">Geometry—not rank alone.</text>
    <path class="line" d="M840 438H870"/><text class="h ink" x="890" y="418">Brackets</text><text class="body muted" x="890" y="450">Read with date + type.</text>
    <path class="line" d="M840 530H870"/><text class="h ink" x="890" y="510">Columns + bays</text><text class="body muted" x="890" y="542">Scale + rhythm.</text>
    <path class="line" d="M810 650H840"/><text class="h ink" x="860" y="630">Platform + stairs</text><text class="body muted" x="860" y="662">Status + movement.</text>
    <path class="line" d="M820 760H850"/><text class="h ink" x="870" y="740">Court</text><text class="body muted" x="870" y="772">Assembly space.</text>
    <text class="h ink" x="175" y="1065">Approach</text><text class="body muted" x="175" y="1100">thresholds</text>
    <text class="h ink" x="405" y="1065">Function</text><text class="body muted" x="405" y="1100">users</text>
    <text class="h ink" x="635" y="1065">Hierarchy</text><text class="body muted" x="635" y="1100">relationships</text>
    <text class="h ink" x="865" y="1065">Period</text><text class="body muted" x="865" y="1100">survival + repair</text>
  </g>

  <rect x="1210" y="270" width="490" height="900" rx="22" fill="#173f35"/>
  <g class="t" fill="#fff">
    <text class="label" x="1260" y="330" fill="#f2c56b">USE CLUES IN ORDER</text>
    <text class="h" x="1260" y="395">1 · Route</text><text class="body" x="1260" y="430" fill="#d5e2dd">What changed after each gate?</text>
    <text class="h" x="1260" y="505">2 · Court</text><text class="body" x="1260" y="540" fill="#d5e2dd">Who could assemble here?</text>
    <text class="h" x="1260" y="615">3 · Neighbors</text><text class="body" x="1260" y="650" fill="#d5e2dd">How do side buildings shape use?</text>
    <text class="h" x="1260" y="725">4 · Name + form</text><text class="body" x="1260" y="760" fill="#d5e2dd">What hypothesis do they suggest?</text>
    <text class="h" x="1260" y="835">5 · Terrain</text><text class="body" x="1260" y="870" fill="#d5e2dd">Strict axis or adapted route?</text>
    <text class="h" x="1260" y="945">6 · Verification</text><text class="body" x="1260" y="980" fill="#d5e2dd"><tspan x="1260">Which period survives, was rebuilt,</tspan><tspan x="1260" dy="32">restored or reconstructed?</tspan></text>
  </g>
  <text class="t small muted" x="100" y="1295">Composite observation guide—not a reconstruction of one palace building.</text>
  <text class="t small pine" x="1700" y="1295" text-anchor="end">Dama Korea · Original editorial diagram</text>
</svg>
