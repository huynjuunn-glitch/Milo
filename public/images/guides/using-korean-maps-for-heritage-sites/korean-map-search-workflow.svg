<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Workflow for turning a heritage record into a usable Korean map route</title>
  <desc id="desc">Six verification stages move from official place identity to a matching local record, practical entrance, transit chain, return route and offline recovery card, warning that a central pin is not necessarily a visitor gate.</desc>
  <defs>
    <style>.bg{fill:#fbfaf6}.ink{fill:#17211d}.muted{fill:#56645e}.pine{fill:#173f35}.rust{fill:#a94330}.paper{fill:#fff}.soft{fill:#dde9e2}.clay{fill:#f2e7d7}.border{stroke:#d5dcd6;stroke-width:3}.t{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.serif{font-family:Georgia,"Times New Roman",serif}.title{font-size:58px;font-weight:600}.sub{font-size:26px}.label{font-size:21px;font-weight:850;letter-spacing:2px}.h{font-size:28px;font-weight:780}.body{font-size:22px}.small{font-size:19px}.num{font-size:23px;font-weight:900;fill:#fff}</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#245849"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1100"/>
  <text class="t label rust" x="90" y="78">MAP VERIFICATION · KOREA HERITAGE</text>
  <text class="serif title ink" x="90" y="150">A successful-looking pin is only step two</text>
  <text class="t sub muted" x="90" y="198">Verify place identity, entrance and route as separate claims.</text>
  <g class="t">
    <path d="M170 350H1430" fill="none" stroke="#245849" stroke-width="8" marker-end="url(#arrow)"/>
    <circle cx="170" cy="350" r="36" fill="#173f35"/><text class="num" x="157" y="358">01</text>
    <circle cx="420" cy="350" r="36" fill="#173f35"/><text class="num" x="407" y="358">02</text>
    <circle cx="670" cy="350" r="36" fill="#a94330"/><text class="num" x="657" y="358">03</text>
    <circle cx="920" cy="350" r="36" fill="#173f35"/><text class="num" x="907" y="358">04</text>
    <circle cx="1170" cy="350" r="36" fill="#173f35"/><text class="num" x="1157" y="358">05</text>
    <circle cx="1430" cy="350" r="36" fill="#173f35"/><text class="num" x="1417" y="358">06</text>
    <text class="h ink" x="105" y="425">Identity</text><text class="body muted" x="105" y="464"><tspan x="105">English + Hangul</tspan><tspan x="105" dy="30">region + manager</tspan></text>
    <text class="h ink" x="350" y="425">Place record</text><text class="body muted" x="350" y="464"><tspan x="350">Match at least</tspan><tspan x="350" dy="30">two identity fields</tspan></text>
    <text class="h rust" x="605" y="425">Entrance</text><text class="body muted" x="605" y="464"><tspan x="605">Gate, ticket office</tspan><tspan x="605" dy="30">or check-in point</tspan></text>
    <text class="h ink" x="850" y="425">Transit chain</text><text class="body muted" x="850" y="464"><tspan x="850">Direction, transfer,</tspan><tspan x="850" dy="30">stop, final walk</tspan></text>
    <text class="h ink" x="1100" y="425">Return</text><text class="body muted" x="1100" y="464"><tspan x="1100">Actual exit +</tspan><tspan x="1100" dy="30">earlier option</tspan></text>
    <text class="h ink" x="1360" y="425">Offline</text><text class="body muted" x="1360" y="464"><tspan x="1360">Address, stops,</tspan><tspan x="1360" dy="30">operator link</tspan></text>
  </g>
  <rect x="90" y="600" width="1420" height="155" rx="20" fill="#f2e7d7" stroke="#a94330" stroke-width="3"/>
  <text class="t label rust" x="130" y="650">CRITICAL DISTINCTION</text>
  <text class="t h ink" x="130" y="700">Property pin ≠ practical entrance</text>
  <text class="t body muted" x="650" y="700">A large palace, temple, fortress or archaeological zone may be pinned at its center or boundary.</text>
  <rect x="90" y="815" width="1420" height="145" rx="18" fill="#173f35"/>
  <text class="t label" x="130" y="865" fill="#f2c56b">STOP AND CROSS-CHECK WHEN</text>
  <text class="t body" x="130" y="915" fill="#fff">route ends at a boundary · English and Korean results diverge · final walk lacks a clear public path · return disappears</text>
  <text class="t small muted" x="90" y="1050">Brand-neutral workflow—not a map interface, route map or endorsement of one provider.</text>
  <text class="t small pine" x="1510" y="1050" text-anchor="end">Dama Korea · Original editorial diagram</text>
</svg>
